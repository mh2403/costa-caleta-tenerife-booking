<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Costa Caleta Tenerife</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        var pathname = window.location.pathname || '/';
        var assetPattern = /\.(?:css|js|mjs|map|json|txt|xml|ico|png|jpe?g|gif|webp|avif|svg|mp4|webm|mov|pdf|woff2?|ttf|eot)$/i;
        var isAssetRequest = pathname.indexOf('/assets/') === 0 || pathname.indexOf('/.well-known/') === 0 || assetPattern.test(pathname);

        if (isAssetRequest) return;

        var redirectPath = pathname + window.location.search + window.location.hash;

        try {
          window.sessionStorage.setItem('spa-redirect-path', redirectPath);
        } catch (error) {
          console.warn('Could not preserve SPA redirect path.', error);
        }

        window.location.replace('/?spa-redirect=' + encodeURIComponent(redirectPath));
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      a {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Redirecting back into the website...</p>
      <noscript>
        <p>Page not found.</p>
      </noscript>
      <p><a href="/">Go back to the homepage</a></p>
    </main>
  </body>
</html>
